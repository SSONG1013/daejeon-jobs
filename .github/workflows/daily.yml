name: 대전 채용공고 매일 갱신

on:
  schedule:
    - cron: "0 23 * * *"   # 매일 한국시간 오전 8시 (UTC 23시)
  workflow_dispatch:        # Actions 화면에서 수동 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 채용공고 수집
        env:
          JOB_API_KEY: ${{ secrets.JOB_API_KEY }}
          OUTPUT_DIR: docs
        run: python daejeon_jobs.py
      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "채용공고 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)" || echo "변경 없음"
          git push
